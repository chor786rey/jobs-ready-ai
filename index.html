    <script>
      (function() {
        var _err = console.error;
        console.error = function() {
          var str = Array.prototype.slice.call(arguments).map(function(a) {
            return (a && a.message) ? a.message : String(a);
          }).join(' ');
          if (str.indexOf('WebSocket closed without opened') !== -1 || str.indexOf('[vite] WebSocket') !== -1) {
            return;
          }
          _err.apply(console, arguments);
        };
      })();
    </script>
